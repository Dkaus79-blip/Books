name: Update Multi-Page Index

on:
  push:
    paths:
      - "*.html"
      - "!index.html"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate multi-page index
        run: |
          # Collect all book files except index.html
          files=($(ls *.html | grep -v "index.html" | sort))

          per_page=10
          page=1
          count=0

          start_page() {
            filename=$1
            echo "<!DOCTYPE html>" > $filename
            echo "<html lang='en'><head><meta charset='UTF-8'><title>Skeeter Series Library</title>" >> $filename
            echo "<style>" >> $filename
            echo "body { font-family: Arial, sans-serif; background: #f2f6ff; text-align: center; padding: 20px; }" >> $filename
            echo "h1 { color: #003366; margin-bottom: 30px; }" >> $filename
            echo ".button-container { display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 400px; margin: 0 auto; }" >> $filename
            echo "a.book-button { display: block; width: 100%; padding: 14px; background: #007bff; color: white; text-decoration: none; font-size: 18px; border-radius: 8px; transition: background 0.2s; }" >> $filename
            echo "a.book-button:hover { background: #0056b3; }" >> $filename
            echo ".nav-button { margin-top: 20px; font-size: 20px; }" >> $filename
            echo "</style></head><body>" >> $filename
            echo "<h1>Skeeter Series Library – Page $page</h1>" >> $filename
            echo "<div class='button-container'>" >> $filename
          }

          end_page() {
            filename=$1
            echo "</div>" >> $filename

            if [ $page -gt 1 ]; then
              prev=$((page-1))
              echo "<a class='book-button nav-button' href='page${prev}.html'>← Back Page</a>" >> $filename
            fi

            echo "</body></html>" >> $filename
          }

          current_file="index.html"
          start_page $current_file

          for file in "${files[@]}"; do
            title=$(basename "$file" .html | sed 's/_/ /g')

            if [ $count -eq $per_page ]; then
              end_page $current_file
              page=$((page+1))
              current_file="page${page}.html"
              start_page $current_file
              count=0
            fi

            echo "<a class='book-button' href='$file'>$title</a>" >> $current_file
            count=$((count+1))
          done

          end_page $current_file

          for ((i=1; i<page; i++)); do
            file="page${i}.html"
            next=$((i+1))
            sed -i "/<\/body>/i <a class='book-button nav-button' href='page${next}.html'>Next Page →</a>" $file
          done

      - name: Commit updated pages
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add index.html page*.html
          git commit -m "Auto-update multi-page index" || echo "No changes to commit"
          git push
