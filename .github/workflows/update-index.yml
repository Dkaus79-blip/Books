name: Update Multi-Page Index

on:
  push:
    paths:
      - "Books/**/*.[Hh][Tt][Mm][Ll]"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate multi-page index
        shell: bash
        run: |
          shopt -s nullglob

          # SAFE FILE COLLECTION (handles anything + mixed-case extensions)
          mapfile -t files < <(find Books -maxdepth 1 -type f -iregex '.*\.[Hh][Tt][Mm][Ll]' | sort -f)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No HTML files found in Books/"
            exit 0
          fi

          per_page=10
          page=1
          count=0

          start_page() {
            filename=$1
            echo "<!DOCTYPE html>" > "$filename"
            echo "<html lang='en'><head><meta charset='UTF-8'><title>Skeeter Series Library</title>" >> "$filename"
            echo "<style>" >> "$filename"
            echo "body { font-family: Arial, sans-serif; background: #f2f6ff; text-align: center; padding: 20px; }" >> "$filename"
            echo "h1 { color: #003366; margin-bottom: 30px; }" >> "$filename"
            echo ".button-container { display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 400px; margin: 0 auto; }" >> "$filename"
            echo "a.book-button { display: block; width: 100%; padding: 14px; background: #007bff; color: white; text-decoration: none; font-size: 18px; border-radius: 8px; transition: background 0.2s; }" >> "$filename"
            echo "a.book-button:hover { background: #0056b3; }" >> "$filename"
            echo ".nav-button { margin-top: 20px; font-size: 20px; }" >> "$filename"
            echo "</style></head><body>" >> "$filename"
            echo "<h1>Skeeter Series Library – Page $page</h1>" >> "$filename"
            echo "<div class='button-container'>" >> "$filename"
          }

          end_page() {
            filename=$1
            echo "</div>" >> "$filename"

            if [ $page -gt 1 ]; then
              prev=$((page-1))
              echo "<a class='book-button nav-button' href='page${prev}.html'>← Back Page</a>" >> "$filename"
            fi

            echo "</body></html>" >> "$filename"
          }

          current_file="Books/index.html"
          start_page "$current_file"

          for file in "${files[@]}"; do
            base=$(basename "$file")
            title="${base%.*}"
            title="${title//_/ }"

            if [ $count -eq $per_page ]; then
              end_page "$current_file"
              page=$((page+1))
              current_file="Books/page${page}.html"
              start_page "$current_file"
              count=0
            fi

            echo "<a class='book-button' href='$base'>$title</a>" >> "$current_file"
            count=$((count+1))
          done

          end_page "$current_file"

          # SAFE PAGINATION LOOP (never touches page1)
          for ((i=2; i<=page; i++)); do
            file="Books/page${i}.html"
            next=$((i+1))

            if [ -f "Books/page${next}.html" ]; then
              tmpfile=$(mktemp)
              awk -v nextpage="page${next}.html" '
                /<\/body>/ {
                  print "<a class='\''book-button nav-button'\'' href='\''" nextpage "'\''>Next Page →</a>"
                }
                { print }
              ' "$file" > "$tmpfile"
              mv "$tmpfile" "$file"
            fi
          done

      - name: Commit updated pages
        shell: bash
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add Books/index.html Books/page*.html
          git commit -m "Auto-update multi-page index" || echo "No changes to commit"
          git push
